<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="DDS Studio — двухканальный DDS 1 ГГц с 48-битным аккумулятором">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2b"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.76" cy="0.38" r="0.48">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.08" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b2b"/>
      <stop offset="1" stop-color="#070a11"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <style>
    .t{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    .flow{stroke-dasharray:7 9;animation:flow 1.1s linear infinite}
    .slow{animation-duration:2.2s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glowV)"/>
    <rect width="1280" height="420" fill="url(#glowC)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#2a3346"/>

  <!-- Icon -->
  <g transform="translate(58 58) scale(0.104)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#iconbg)"/>
    <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#2a3346" stroke-width="12"/>
    <g stroke="#3a4560" stroke-width="18" stroke-linecap="round">
      <path d="M300 200v-60M412 200v-60M524 200v-60M636 200v-60M748 200v-60"/>
      <path d="M300 884v-60M412 884v-60M524 884v-60M636 884v-60M748 884v-60"/>
    </g>
    <rect x="236" y="236" width="552" height="552" rx="72" fill="#0d1220" stroke="#3a4560" stroke-width="14"/>
    <path d="M290 600 L370 600 L370 430 L470 430 L470 640 L570 640 L570 390 L670 390 L670 560 L734 560" fill="none" stroke="url(#wave)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="734" cy="330" r="34" fill="#34d399"/>
  </g>

  <!-- Title: keep the left column under x≈620 so it never runs into the panel -->
  <text class="t" x="176" y="118" font-size="54" font-weight="700" fill="#e8edf5" letter-spacing="-1">DDS Studio</text>
  <text class="t" x="178" y="150" font-size="16" fill="#7d8aa0" letter-spacing="2">RUST · EGUI · REACT 19</text>

  <text class="t" x="64" y="216" font-size="23" font-weight="600" fill="#e8edf5">Интерактивная лаборатория 1508ПЛ8Т</text>
  <text class="t" x="64" y="248" font-size="17" fill="#b6c1d3">АО НПЦ «ЭЛВИС» 1508ПЛ8Т и плата DDS 48–52 МГц, ревизия F:</text>
  <text class="t" x="64" y="273" font-size="17" fill="#b6c1d3">частота, спектр, ЛЧМ, манипуляции — и виртуальная плата</text>

  <!-- Pills: 2 rows × 2; put the chip's headline specs in the first row -->
  <g class="t" font-size="15" text-anchor="middle">
    <rect x="64" y="304" width="200" height="34" rx="17" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="164" y="326" fill="#67e8f9">48–52 МГц · шаг 1,7 мкГц</text>
    <rect x="276" y="304" width="190" height="34" rx="17" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="371" y="326" fill="#c4b5fd">UART → прошивка D2</text>
    <rect x="64" y="348" width="214" height="34" rx="17" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="171" y="370" fill="#fcd34d">Симулятор без платы</text>
    <rect x="290" y="348" width="210" height="34" rx="17" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="395" y="370" fill="#6ee7b7">macOS · Windows · Web</text>
  </g>

  <!-- Panel: the chip's signal chain (redraw from the datasheet block diagram) -->
  <rect x="668" y="48" width="564" height="324" rx="20" fill="#0b0f18" fill-opacity="0.72" stroke="#2a3346"/>
  <text class="t" x="692" y="82" font-size="12" fill="#7d8aa0" letter-spacing="1.6">ПУТЬ СИГНАЛА 1508ПЛ8Т</text>
  <g class="pulse"><circle cx="1146" cy="78" r="5" fill="#34d399"/></g>
  <text class="t" x="1158" y="83" font-size="13" font-weight="600" fill="#6ee7b7">готов</text>

  <g fill="none" stroke-width="2.2">
    <path class="flow" d="M790 170H818" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path class="flow" d="M920 170H948" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path class="flow" d="M1050 170H1078" stroke="#34d399" marker-end="url(#aG)"/>
    <path class="flow slow" d="M984 270V204" stroke="#a78bfa" marker-end="url(#aV)"/>
  </g>
  <g class="t" text-anchor="middle">
    <rect x="690" y="136" width="100" height="68" rx="12" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="740" y="166" font-size="15" font-weight="700" fill="#e8edf5">ПРОФИЛИ</text>
    <text x="740" y="186" font-size="12" fill="#fcd34d">dPh · P · Mul</text>
    <rect x="820" y="136" width="100" height="68" rx="12" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="870" y="166" font-size="15" font-weight="700" fill="#e8edf5">ФАЗА</text>
    <text x="870" y="186" font-size="12" fill="#fcd34d">48 бит</text>
    <rect x="950" y="136" width="100" height="68" rx="12" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="1000" y="166" font-size="15" font-weight="700" fill="#e8edf5">ЦАП</text>
    <text x="1000" y="186" font-size="12" fill="#c4b5fd">10 бит</text>
    <rect x="1080" y="136" width="128" height="68" rx="12" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-width="1.6"/>
    <text x="1144" y="166" font-size="15" font-weight="700" fill="#e8edf5">ФНЧ → XW2</text>
    <text x="1144" y="186" font-size="12" fill="#6ee7b7">−10 дБм</text>
    <rect x="924" y="270" width="120" height="56" rx="12" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="984" y="295" font-size="15" font-weight="700" fill="#e8edf5">ТАКТ</text>
    <text x="984" y="314" font-size="12" fill="#c4b5fd">480 МГц, XW1</text>
  </g>
  <text class="m" x="692" y="352" font-size="12" fill="#7d8aa0">Engine::handle(cmd, args) · один RPC для desktop и веба</text>
</svg>

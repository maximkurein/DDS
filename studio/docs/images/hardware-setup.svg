<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="Подключение платы DDS 48–52 МГц к компьютеру через USB-UART адаптер">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
      .h { font-size: 17px; font-weight: 700; fill: #e8edf5; }
      .s { font-size: 13px; fill: #94a3b8; }
      .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #cbd5e1; }
      .lab { font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1280" height="600" fill="url(#bg)"/>
  <rect width="1280" height="600" fill="url(#grid)"/>

  <text x="40" y="52" class="h" font-size="24">Подключение платы</text>
  <text x="40" y="78" class="s">Без железа работает виртуальная плата. Для реальной нужен USB-UART адаптер с логикой 5 В и прошивка D2 версии 1.1+.</text>

  <!-- PC -->
  <rect x="40" y="200" width="190" height="130" rx="16" fill="#151c28" stroke="#334155" stroke-width="1.5"/>
  <text x="135" y="245" class="h" text-anchor="middle">DDS Studio</text>
  <text x="135" y="268" class="s" text-anchor="middle">macOS · Windows</text>
  <text x="135" y="288" class="s" text-anchor="middle">или веб-режим</text>

  <!-- USB -->
  <path d="M230 265 H300" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="265" y="255" class="lab" text-anchor="middle">USB</text>

  <!-- Adapter -->
  <rect x="304" y="190" width="190" height="150" rx="16" fill="#1a1630" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="399" y="228" class="h" text-anchor="middle">USB-UART 5 В</text>
  <text x="399" y="250" class="s" text-anchor="middle">CH340 · CP2102 · FT232</text>
  <text x="399" y="272" class="s" text-anchor="middle">38400 8N1</text>
  <text x="474" y="300" class="m" text-anchor="end">RX</text>
  <text x="474" y="318" class="m" text-anchor="end">TX</text>
  <text x="474" y="336" class="m" text-anchor="end">GND</text>

  <!-- Wires adapter → X1 -->
  <g stroke-width="2.4" fill="none">
    <path d="M494 296 H600" stroke="#22d3ee" marker-start="url(#ar)"/>
    <path d="M494 314 H600" stroke="#f59e0b" marker-end="url(#ar)"/>
    <path d="M494 332 H600" stroke="#64748b"/>
  </g>
  <text x="547" y="368" class="lab" text-anchor="middle">VCC адаптера</text>
  <text x="547" y="384" class="lab" text-anchor="middle">не подключать</text>

  <!-- Board -->
  <rect x="604" y="120" width="500" height="330" rx="18" fill="#0f2a22" stroke="#10b981" stroke-opacity="0.7" stroke-width="1.8"/>
  <text x="624" y="148" class="h">DDS 48–52 МГц, ревизия F</text>
  <text x="624" y="168" class="s">120 × 50 мм</text>

  <!-- X1 -->
  <rect x="604" y="280" width="78" height="66" rx="8" fill="#15202b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="643" y="274" class="lab" text-anchor="middle">X1 (ISP)</text>
  <text x="614" y="300" class="m">1 TXD0</text>
  <text x="614" y="318" class="m">4 RXD0</text>
  <text x="614" y="336" class="m">6 GND</text>

  <!-- D2 -->
  <rect x="712" y="250" width="140" height="110" rx="12" fill="#13222f" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="782" y="290" class="h" text-anchor="middle">D2</text>
  <text x="782" y="310" class="s" text-anchor="middle">1887ВЕ7Т, 5 В</text>
  <text x="782" y="330" class="s" text-anchor="middle">прошивка 1.1</text>
  <path d="M682 313 H710" stroke="#94a3b8" stroke-width="2"/>

  <!-- D1 -->
  <rect x="900" y="200" width="130" height="110" rx="12" fill="#1f1a10" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="965" y="242" class="h" text-anchor="middle">D1</text>
  <text x="965" y="262" class="s" text-anchor="middle">1508ПЛ8Т</text>
  <text x="965" y="282" class="s" text-anchor="middle">DDS, 3,3/1,8 В</text>
  <path d="M852 280 H898" stroke="#3b82f6" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="875" y="270" class="lab" text-anchor="middle">SPI</text>
  <text x="875" y="300" class="lab" text-anchor="middle">D3/D4</text>

  <!-- DIP -->
  <rect x="712" y="390" width="140" height="40" rx="8" fill="#3a1414" stroke="#ef4444" stroke-opacity="0.7"/>
  <text x="782" y="415" class="s" text-anchor="middle" fill="#fca5a5">S2 + S3 (DIP), S4</text>
  <path d="M782 388 V362" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- Filter -->
  <rect x="930" y="340" width="100" height="56" rx="10" fill="#13202a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="980" y="364" class="h" font-size="15" text-anchor="middle">ФНЧ</text>
  <text x="980" y="383" class="lab" text-anchor="middle">7-й порядок</text>
  <path d="M965 310 V338" stroke="#22c55e" stroke-width="2.4" marker-end="url(#ar)"/>
  <path d="M1030 368 H1102" stroke="#22c55e" stroke-width="2.4"/>

  <!-- connectors on the board edge -->
  <rect x="1094" y="350" width="22" height="36" rx="4" fill="#d4d4d8"/>
  <text x="1105" y="404" class="m" text-anchor="middle">XW2</text>
  <rect x="1040" y="440" width="36" height="22" rx="4" fill="#d4d4d8"/>
  <text x="1036" y="476" class="m" text-anchor="end">XW1 · S1 замкнут</text>
  <path d="M1058 440 V300 H1032" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="616" y="420" width="22" height="34" rx="4" fill="#d4d4d8"/>
  <text x="648" y="442" class="m">X2</text>

  <!-- Analyzer -->
  <path d="M1116 368 H1150" stroke="#22c55e" stroke-width="2.4" marker-end="url(#ar)"/>
  <rect x="1154" y="320" width="110" height="96" rx="14" fill="#151c28" stroke="#334155" stroke-width="1.5"/>
  <text x="1209" y="358" class="h" font-size="15" text-anchor="middle">Анализатор</text>
  <text x="1209" y="378" class="s" text-anchor="middle">вход 50 Ом</text>
  <text x="1209" y="396" class="s" text-anchor="middle">≈ −10 дБм</text>

  <!-- Clock -->
  <rect x="968" y="500" width="180" height="70" rx="14" fill="#151c28" stroke="#334155" stroke-width="1.5"/>
  <text x="1058" y="530" class="h" font-size="15" text-anchor="middle">Генератор 480 МГц</text>
  <text x="1058" y="550" class="s" text-anchor="middle">0 дБм (−10…+5)</text>
  <path d="M1058 498 V464" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- Supply -->
  <rect x="560" y="500" width="160" height="70" rx="14" fill="#151c28" stroke="#334155" stroke-width="1.5"/>
  <text x="640" y="530" class="h" font-size="15" text-anchor="middle">Источник +15 В</text>
  <text x="640" y="550" class="s" text-anchor="middle">≥ 0,5 А · X2.1 «+»</text>
  <path d="M627 498 V456" stroke="#f43f5e" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- Notes -->
  <g class="s">
    <text x="40" y="440">⚠ Логика D2 — 5 В. Адаптер 3,3 В — только с RX, допускающим 5 В.</text>
    <text x="40" y="462">⚠ X1 — это и ISP: при ISP-программировании адаптер отсоединить.</text>
    <text x="40" y="484">⚠ Соединять при выключенном питании, GND — первым.</text>
  </g>
</svg>

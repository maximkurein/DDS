[package]
name = "dds-egui"
description = "DDS Studio — нативный интерфейс на egui (без WebView)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dds-egui"
path = "src/main.rs"

[dependencies]
dds-core = { path = "../dds-core" }
serde_json = "1"
# 0.33 / 0.34: the newest line that builds on Rust 1.88–1.90 (eframe 0.34+ needs 1.92)
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = "0.33"
rfd = "0.15"

[build-dependencies]
embed-resource = "3.0.12"

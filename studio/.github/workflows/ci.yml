name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Тесты и проверка типов
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Версии синхронизированы
        run: python3 tools/update_version.py status

      - name: Системные пакеты (WebKitGTK для Tauri, libudev для serialport)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Фронтенд (tsc + vite)
        run: npm run build
      - name: Модель кристалла (dds-core)
        run: cargo test -p dds-core
      - name: Сервер и desktop компилируются
        run: cargo check -p dds-server -p dds-studio

  desktop:
    name: Сборка ${{ matrix.name }}
    needs: check
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: dds-studio-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 10

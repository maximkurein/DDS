name: Release

# Релиз DDS Studio (egui): macOS universal .dmg и Windows x64 .zip в черновик GitHub Release.
#   автоматически — при push метки studio-vX.Y.Z (совпадающей с studio/config/version.json);
#   вручную — Actions → Release → Run workflow → метка (например, studio-v0.2.0).
on:
  push:
    tags: ["studio-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Метка релиза (studio-vX.Y.Z), уже отправленная на GitHub"
        required: true
        default: "studio-v0.3.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Метка совпадает с версией
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: studio-vX.Y.Z = studio/config/version.json
        run: |
          V=$(python3 -c "import json;print(json.load(open('studio/config/version.json'))['app_info']['version'])")
          test "studio-v$V" = "$TAG" || { echo "::error::Метка $TAG не совпадает с версией studio-v$V"; exit 1; }
          python3 studio/tools/update_version.py status
          python3 tools/update_version.py status

  build:
    name: Сборка ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - name: .app + .dmg (macOS)
        if: runner.os == 'macOS'
        run: python3 build_macos.py --universal
      - name: Inno Setup 6
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: .zip и установщик (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dds-studio-${{ startsWith(matrix.os, 'macos') && 'macos-universal' || 'windows-x64' }}
          path: |
            studio/release/*/*.dmg
            studio/release/*/*.zip
            studio/release/*/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Черновик релиза
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: gh release create --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # артефакты лежат в подпапке vX.Y.Z/ — собрать файлы в одну папку
          mkdir out
          find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*-setup.exe' \) -exec mv {} out/ \;
          cd out
          ls -la
          sha256sum *.dmg *.zip *-setup.exe > checksum.txt
          cat > notes.md <<EOF
          Сборки DDS Studio для macOS (universal: Apple Silicon и Intel) и Windows x64.
          Изменения — в [studio/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG}/studio/CHANGELOG.md).
          Сборки не подписаны: macOS — правый клик → «Открыть»; Windows SmartScreen — «Подробнее» → «Выполнить в любом случае».
          Разработчик: Kurein M. N.
          EOF
          gh release create "$TAG" --repo "${{ github.repository }}" --draft \
            --title "DDS Studio $TAG" --notes-file notes.md \
            ./*.dmg ./*.zip ./*-setup.exe checksum.txt

name: CI

on:
  push:
    branches: [main]
    paths: ["studio/**", "firmware/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["studio/**", "firmware/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Прошивка D2 — host-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset host-tests
      - run: cmake --build --preset host-tests
      - run: ctest --preset host-tests --output-on-failure

  studio:
    name: DDS Studio — тесты и сборка интерфейса
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - name: Версии синхронизированы
        run: python3 tools/update_version.py status

      - name: Системные пакеты (libudev для serialport, GTK для диалогов файлов egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgtk-3-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci
      - name: Веб-интерфейс (tsc + vite)
        run: npm run build
      - name: Модель 1508ПЛ8Т и egui (тесты)
        run: cargo test -p dds-core -p dds-egui
      - name: Clippy (egui, сервер)
        run: cargo clippy -p dds-egui -p dds-server --all-targets --no-deps -- -D warnings
      - name: Весь workspace компилируется
        run: cargo check --workspace

  desktop:
    name: Сборка ${{ matrix.name }}
    needs: studio
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - name: .app + .dmg (macOS)
        if: runner.os == 'macOS'
        run: python3 build_macos.py --universal
      - name: Inno Setup 6
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: .zip и установщик (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dds-studio-${{ startsWith(matrix.os, 'macos') && 'macos-universal' || 'windows-x64' }}
          path: |
            studio/release/*/*.dmg
            studio/release/*/*.zip
            studio/release/*/*-setup.exe
          if-no-files-found: error
          retention-days: 14

# Профиль avrdude для 1887ВЕ7Т (НИИЭТ), функционального аналога ATmega128.
#
# Подключение:  avrdude -C +tools/avrdude/1887ve7t.conf -p 1887ve7t -c atmelice ...
# (знак «+» — читать этот файл дополнительно к системному avrdude.conf; avrdude 7.1+).
#
# Основа — профиль производителя для Atmel Studio 6:
#   info/1887BE1T/xml files/Atmel Studio 6/devices/1887BE7T.xml
# От ATmega128.xml он отличается только размером страницы памяти программ:
#   FLASH pagesize = 0x40 (64 байта = 32 слова) вместо 0x100;
#   IspProgramFlash_blockSize = 32, PpProgramFlash_blockSize = 64.
# Сигнатура 1E 97 02 и JTAG ID 0x0970203F — как у ATmega128.
#
# Внимание: в ТО КФДЛ.431295.044ТО есть внутреннее расхождение по размеру
# страницы (с. 29 — 32 слова; табл. 3.124 на с. 302 — 128 слов для RWW).
# Профиль следует XML производителя. Проверка чтением после записи
# обязательна (у avrdude включена по умолчанию, ключ -V не использовать).
#
# Стёртая память программ 1887ВЕ7Т читается как 0x0000, а не 0xFFFF
# (ТО, с. 29, 313). Поэтому сравнение с «пустым» значением 0xFF к этому МК
# не применимо.

part parent "m128"
    desc                   = "1887VE7T";
    id                     = "1887ve7t";
    # Уникальный номер вместо 85 (он закреплён за ATmega128).
    mcuid                  = 1887;
    # Стирание кристалла: ТО — не менее 10 мс, XML — eraseDelay 20 мс.
    chip_erase_delay       = 20000;

    memory "flash"
        page_size          = 64;
        num_pages          = 2048;
        blocksize          = 32;
        # 32 слова на страницу: адрес слова внутри страницы — a4…a0,
        # номер страницы — a15…a5.
        loadpage_lo        = "0100.0000--xxxx.xxxx--xxxa.aaaa--iiii.iiii";
        loadpage_hi        = "0100.1000--xxxx.xxxx--xxxa.aaaa--iiii.iiii";
        writepage          = "0100.1100--aaaa.aaaa--aaax.xxxx--xxxx.xxxx";
    ;
;
